[phases.setup]
nixPkgs = ["python312", "nodejs_20", "gcc"]

[phases.install]
cmds = [
  "pip install -r apps/api/requirements.txt",
  "cd apps/web && npm install"
]

[phases.build]
cmds = [
  "cd apps/web && npm run build",
  "cp -r apps/web/out apps/api/web_out"
]

[start]
cmd = "export PYTHONPATH=/app/apps/api && cd /app/apps/api && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
